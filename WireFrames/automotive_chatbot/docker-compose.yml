# Docker Compose for Automotive Chatbot
# Simple deployment configuration for local testing and AWS deployment

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: automotive-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatbot-network

  # Backend API
  backend:
    image: csit321fyp/automotive-chatbot-backend:latest
    container_name: automotive-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/automotive_chatbot?authSource=admin
      - RASA_SERVER_URL=http://rasa:5005
    depends_on:
      - mongodb
      - rasa
    networks:
      - chatbot-network

  # Rasa NLU/Core
  rasa:
    image: csit321fyp/automotive-chatbot-rasa:latest
    container_name: automotive-rasa
    restart: unless-stopped
    ports:
      - "5005:5005"
    command: ["rasa", "run", "--enable-api", "--cors", "*", "--port", "5005", "-i", "0.0.0.0"]
    networks:
      - chatbot-network

  # Frontend
  frontend:
    image: csit321fyp/automotive-chatbot-frontend:latest
    container_name: automotive-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # Next.js Environment Variables (NEXT_PUBLIC_ prefix required for client-side access)
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - NEXT_PUBLIC_DOMAIN=http://54.254.180.103
      - NEXT_PUBLIC_API_URL=http://54.254.180.103:8000
      - NEXT_PUBLIC_RASA_URL=http://54.254.180.103:5005
      - NEXT_PUBLIC_WIDGET_URL=http://54.254.180.103
      - NEXT_PUBLIC_FRONTEND_URL=http://54.254.180.103
      - NEXT_PUBLIC_BACKEND_URL=http://54.254.180.103:8000
      - NEXT_PUBLIC_FRONTEND_PORT=80
      - NEXT_PUBLIC_BACKEND_PORT=8000
      - NEXT_PUBLIC_RASA_PORT=5005
      - NEXT_PUBLIC_DEBUG=false
    depends_on:
      - backend
    networks:
      - chatbot-network

volumes:
  mongodb_data:

networks:
  chatbot-network:
    driver: bridge

# Instructions:
# 1. Build and push images to Docker Hub using docker-build.ps1 and docker-push.ps1
# 2. For local testing: docker-compose up -d
# 3. For AWS deployment: use ssh-deploy.ps1 script (copies this file to EC2 and runs docker-compose up -d)
# 4. Access frontend at http://localhost (or http://EC2_IP for AWS)
# 5. Test widget at http://localhost/test-client-widget.html
# 6. All images are pulled from Docker Hub (csit321fyp/automotive-chatbot-*)