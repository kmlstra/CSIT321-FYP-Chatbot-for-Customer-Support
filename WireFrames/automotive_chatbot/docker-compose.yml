# Docker Compose for Automotive Chatbot
# Optimized configuration for MongoDB Atlas and AWS deployment

version: '3.8'

services:
  # Backend API
  backend:
    image: csit321fyp/automotive-chatbot-backend:latest
    container_name: automotive-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb+srv://CleverAdmin:P%40ssw0rd%211@clevercompanioncluster.ygakb6r.mongodb.net/?retryWrites=true&w=majority&appName=AiChatBot}
      - MONGODB_DB=${MONGODB_DB:-automotive_chatbot_saas}
      - CHATBOT_MONGODB_URL=${MONGODB_URL:-mongodb+srv://CleverAdmin:P%40ssw0rd%211@clevercompanioncluster.ygakb6r.mongodb.net/?retryWrites=true&w=majority&appName=AiChatBot}
      - RASA_SERVER_URL=http://rasa:5005
      - DOMAIN=${DOMAIN:-http://localhost}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - rasa-actions
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Rasa NLU/Core
  rasa:
    image: automotive-chatbot-rasa:latest
    container_name: automotive-rasa
    restart: unless-stopped
    ports:
      - "5005:5005"
    # Use default startup script from Dockerfile
    depends_on:
      - rasa-actions
    networks:
      - chatbot-network

  # Rasa Actions Server
  rasa-actions:
    image: automotive-chatbot-rasa:latest
    container_name: automotive-rasa-actions
    ports:
      - "5055:5055"
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb+srv://CleverAdmin:P%40ssw0rd%211@clevercompanioncluster.ygakb6r.mongodb.net/?retryWrites=true&w=majority&appName=AiChatBot}
      - MONGODB_DB=${MONGODB_DB:-automotive_chatbot_saas}
    command: ["python", "/app/start_rasa_actions.py"]
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/webhook"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend
  frontend:
    image: csit321fyp/automotive-chatbot-frontend:latest
    container_name: automotive-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Next.js Environment Variables (NEXT_PUBLIC_ prefix required for client-side access)
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-http://localhost}
      - NEXT_PUBLIC_API_URL=${DOMAIN:-http://localhost}:8000
      - NEXT_PUBLIC_RASA_URL=${DOMAIN:-http://localhost}:5005
      - NEXT_PUBLIC_WIDGET_URL=${DOMAIN:-http://localhost}:3000
      - NEXT_PUBLIC_FRONTEND_URL=${DOMAIN:-http://localhost}:3000
      - NEXT_PUBLIC_BACKEND_URL=${DOMAIN:-http://localhost}:8000
      - NEXT_PUBLIC_FRONTEND_PORT=3000
      - NEXT_PUBLIC_BACKEND_PORT=8000
      - NEXT_PUBLIC_RASA_PORT=5005
      - NEXT_PUBLIC_DEBUG=false
    depends_on:
      - backend
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chatbot-network:
    driver: bridge

# Instructions:
# 1. Build and push images to Docker Hub using docker-build.ps1 and docker-push.ps1
# 2. For local testing: docker-compose up -d
# 3. For AWS deployment: use ssh-deploy.ps1 script (copies this file to EC2 and runs docker-compose up -d)
# 4. Access frontend at http://localhost (or http://EC2_IP for AWS)
# 5. Test widget at http://localhost/test-client-widget.html
# 6. All images are pulled from Docker Hub (csit321fyp/automotive-chatbot-*)