name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
        node-version: [18, 20]
    
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'WireFrames/automotive_chatbot/package.json'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      working-directory: ./WireFrames/automotive_chatbot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-html pytest-json-report
        pip install pytest-xdist pytest-timeout pytest-mock
    
    - name: Install Node.js dependencies
      working-directory: ./WireFrames/automotive_chatbot
      run: npm ci
    
    - name: Set up environment variables
      run: |
        echo "MONGODB_URI=mongodb://admin:password@localhost:27017/test_db?authSource=admin" >> $GITHUB_ENV
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> $GITHUB_ENV
        echo "ENVIRONMENT=test" >> $GITHUB_ENV
        echo "RASA_SERVER_URL=http://localhost:5005" >> $GITHUB_ENV
    
    - name: Wait for MongoDB
      run: |
        timeout 60 bash -c 'until mongosh --host localhost:27017 --username admin --password password --authenticationDatabase admin --eval "db.adminCommand(\"ping\")"; do sleep 2; done'
    
    - name: Run linting
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run quick tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --quick --coverage
    
    - name: Run unit tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --unit --coverage
    
    - name: Run integration tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --integration
    
    - name: Run security tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --security
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./WireFrames/automotive_chatbot/backend/htmlcov/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
    
    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-${{ matrix.python-version }}-${{ matrix.node-version }}
        path: |
          WireFrames/automotive_chatbot/backend/test_reports/
          WireFrames/automotive_chatbot/backend/htmlcov/
        retention-days: 30
    
    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './WireFrames/automotive_chatbot/backend/test_reports/';
          
          if (fs.existsSync(path)) {
            const files = fs.readdirSync(path).filter(f => f.includes('test_summary_'));
            if (files.length > 0) {
              const summaryFile = files[files.length - 1];
              const summary = JSON.parse(fs.readFileSync(path + summaryFile, 'utf8'));
              
              const comment = `## 🧪 Test Results\n\n` +
                `- **Total Suites**: ${summary.total_suites}\n` +
                `- **Passed**: ${summary.passed_suites}\n` +
                `- **Failed**: ${summary.failed_suites}\n` +
                `- **Success Rate**: ${summary.success_rate.toFixed(1)}%\n\n` +
                `### Suite Results:\n` +
                Object.entries(summary.suite_results)
                  .map(([suite, result]) => `- ${result === 'PASSED' ? '✅' : '❌'} ${suite}: ${result}`)
                  .join('\n');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          }

  e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'WireFrames/automotive_chatbot/package.json'
    
    - name: Install dependencies
      working-directory: ./WireFrames/automotive_chatbot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-html pytest-json-report
        npm ci
    
    - name: Set up environment variables
      run: |
        echo "MONGODB_URI=mongodb://admin:password@localhost:27017/test_db?authSource=admin" >> $GITHUB_ENV
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> $GITHUB_ENV
        echo "ENVIRONMENT=test" >> $GITHUB_ENV
        echo "RASA_SERVER_URL=http://localhost:5005" >> $GITHUB_ENV
    
    - name: Start application services
      working-directory: ./WireFrames/automotive_chatbot
      run: |
        npm run dev:backend &
        npm run dev:frontend &
        sleep 30  # Wait for services to start
    
    - name: Run end-to-end tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --e2e
    
    - name: Run performance tests
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        python run_tests.py --performance
    
    - name: Upload E2E test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-reports
        path: |
          WireFrames/automotive_chatbot/backend/test_reports/
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Run Bandit security scan
      working-directory: ./WireFrames/automotive_chatbot/backend
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt
    
    - name: Run Safety check
      working-directory: ./WireFrames/automotive_chatbot
      run: |
        safety check --json --output safety-report.json || true
        safety check
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          WireFrames/automotive_chatbot/backend/bandit-report.json
          WireFrames/automotive_chatbot/safety-report.json
        retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: [test, e2e-tests, security-scan]
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.test.result == 'success' && needs.e2e-tests.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
    
    - name: Notify on failure
      if: needs.test.result == 'failure' || needs.e2e-tests.result == 'failure'
      run: |
        echo "❌ Some tests failed. Please check the logs."
        exit 1