<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleverCompanion - Chat History Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .search-section {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .search-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4F46E5;
        }

        .search-btn {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-1px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            padding: 24px;
            min-height: 400px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #4F46E5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .conversation-info {
            background: #f3f4f6;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            border-left: 4px solid #4F46E5;
        }

        .conversation-info h3 {
            color: #374151;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
            margin-top: 2px;
        }

        .messages-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
        }

        .message.bot .message-avatar {
            background: #e5e7eb;
            color: #374151;
        }

        .message-content {
            flex: 1;
            max-width: 70%;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            border-radius: 16px 16px 4px 16px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-radius: 16px 16px 16px 4px;
        }

        .message-timestamp {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .message.user .message-timestamp {
            text-align: right;
            color: rgba(255, 255, 255, 0.8);
        }

        .message.bot .message-timestamp {
            color: #6b7280;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .export-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
        }

        .export-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .export-btn:hover {
            background: #059669;
        }

        .api-config {
            background: #fffbeb;
            border: 1px solid #fbbf24;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .api-config h4 {
            color: #92400e;
            margin-bottom: 8px;
        }

        .api-config p {
            color: #92400e;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .api-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .search-form {
                flex-direction: column;
            }

            .search-input {
                min-width: 100%;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 CleverCompanion Chat History Viewer</h1>
            <p>Live Support Dashboard - View Customer Conversations</p>
        </div>

        <div class="search-section">
            <div class="api-config">
                <h4>⚙️ API Configuration</h4>
                <p>Enter your backend API URL (for Supabase integration, this should point to your conversation API endpoint):</p>
                <input type="text" id="apiUrl" class="api-input" placeholder="http://localhost:8001/api/conversation" value="http://localhost:8001/api/conversation">
            </div>
            
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    id="conversationId" 
                    class="search-input" 
                    placeholder="Enter Conversation ID (e.g., user_1754271933040_qs19m960z)"
                    required
                >
                <button type="submit" class="search-btn" id="searchBtn">
                    🔍 Search Conversation
                </button>
            </form>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="no-results">
                <div class="no-results-icon">💬</div>
                <h3>Ready to Search</h3>
                <p>Enter a conversation ID above to view the chat history</p>
            </div>
        </div>
    </div>

    <script>
        class ChatHistoryViewer {
            constructor() {
                this.apiUrl = '';
                this.init();
            }

            init() {
                const form = document.getElementById('searchForm');
                const apiUrlInput = document.getElementById('apiUrl');
                
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.searchConversation();
                });

                apiUrlInput.addEventListener('change', (e) => {
                    this.apiUrl = e.target.value.trim();
                });

                // Set initial API URL
                this.apiUrl = apiUrlInput.value;
            }

            async searchConversation() {
                const conversationId = document.getElementById('conversationId').value.trim();
                const searchBtn = document.getElementById('searchBtn');
                const resultsSection = document.getElementById('resultsSection');

                if (!conversationId) {
                    this.showError('Please enter a conversation ID');
                    return;
                }

                if (!this.apiUrl) {
                    this.showError('Please configure the API URL');
                    return;
                }

                // Show loading state
                searchBtn.disabled = true;
                searchBtn.textContent = '🔍 Searching...';
                this.showLoading();

                try {
                    // Fetch conversation history
                    const response = await fetch(`${this.apiUrl}/history/${conversationId}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();
                    
                    if (data.success && data.conversation && data.conversation.length > 0) {
                        this.displayConversation(data.conversation[0], conversationId);
                    } else {
                        this.showNoResults(conversationId);
                    }
                } catch (error) {
                    console.error('Error fetching conversation:', error);
                    this.showError(`Failed to fetch conversation: ${error.message}`);
                } finally {
                    // Reset button state
                    searchBtn.disabled = false;
                    searchBtn.textContent = '🔍 Search Conversation';
                }
            }

            showLoading() {
                const resultsSection = document.getElementById('resultsSection');
                resultsSection.innerHTML = `
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Searching for conversation...</p>
                    </div>
                `;
            }

            showError(message) {
                const resultsSection = document.getElementById('resultsSection');
                resultsSection.innerHTML = `
                    <div class="error-message">
                        <strong>❌ Error:</strong> ${message}
                    </div>
                `;
            }

            showNoResults(conversationId) {
                const resultsSection = document.getElementById('resultsSection');
                resultsSection.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <h3>No Conversation Found</h3>
                        <p>No conversation found with ID: <strong>${conversationId}</strong></p>
                        <p>Please check the ID and try again.</p>
                    </div>
                `;
            }

            displayConversation(conversation, conversationId) {
                const resultsSection = document.getElementById('resultsSection');
                
                // Parse the conversation content
                const messages = this.parseConversationContent(conversation.content || '');
                const timestamp = conversation.timestamp ? new Date(conversation.timestamp).toLocaleString() : 'Unknown';
                
                let html = `
                    <div class="conversation-info">
                        <h3>📋 Conversation Details</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Conversation ID</span>
                                <span class="info-value">${conversationId}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Last Updated</span>
                                <span class="info-value">${timestamp}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Total Messages</span>
                                <span class="info-value">${messages.length}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Status</span>
                                <span class="info-value">Active</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="messages-container">
                `;

                if (messages.length === 0) {
                    html += `
                        <div class="no-results">
                            <p>No messages found in this conversation.</p>
                        </div>
                    `;
                } else {
                    messages.forEach(message => {
                        const messageClass = message.sender.toLowerCase();
                        const avatar = message.sender.toLowerCase() === 'user' ? '👤' : '🤖';
                        const timestamp = new Date().toLocaleTimeString([], { 
                            hour: '2-digit', 
                            minute: '2-digit',
                            hour12: true 
                        });
                        
                        html += `
                            <div class="message ${messageClass}">
                                <div class="message-avatar">${avatar}</div>
                                <div class="message-content">
                                    <div class="message-bubble">
                                        ${this.formatMessageContent(message.content)}
                                    </div>
                                    <div class="message-timestamp">${timestamp}</div>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                    </div>
                    
                    <div class="export-section">
                        <button class="export-btn" onclick="chatViewer.exportConversation('${conversationId}')">
                            📥 Export Conversation
                        </button>
                    </div>
                `;

                resultsSection.innerHTML = html;
                
                // Scroll to top of results
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            }

            parseConversationContent(content) {
                if (!content) return [];
                
                const messages = [];
                const lines = content.split('\n').filter(line => line.trim());
                
                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;
                    
                    // Parse different message formats
                    if (line.startsWith('User: ')) {
                        messages.push({
                            sender: 'User',
                            content: line.substring(6).trim()
                        });
                    } else if (line.startsWith('Bot: ')) {
                        messages.push({
                            sender: 'Bot',
                            content: line.substring(5).trim()
                        });
                    } else if (line.includes(': ')) {
                        // Generic format: "Sender: Message"
                        const colonIndex = line.indexOf(': ');
                        const sender = line.substring(0, colonIndex).trim();
                        const content = line.substring(colonIndex + 2).trim();
                        
                        if (sender && content) {
                            messages.push({ sender, content });
                        }
                    } else {
                        // Treat as system message or continuation
                        if (messages.length > 0) {
                            // Append to last message
                            messages[messages.length - 1].content += '\n' + line;
                        } else {
                            // First message without sender prefix
                            messages.push({
                                sender: 'System',
                                content: line
                            });
                        }
                    }
                });
                
                return messages;
            }

            formatMessageContent(content) {
                if (!content) return '';
                
                return content
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>')
                    .replace(/https?:\/\/[^\s]+/g, '<a href="$&" target="_blank">$&</a>');
            }

            exportConversation(conversationId) {
                const conversation = document.querySelector('.conversation-info');
                const messages = document.querySelector('.messages-container');
                
                if (!conversation || !messages) {
                    alert('No conversation data to export');
                    return;
                }

                // Create export data
                const exportData = {
                    conversationId: conversationId,
                    exportedAt: new Date().toISOString(),
                    messages: this.parseConversationContent(document.querySelector('.messages-container').textContent)
                };

                // Download as JSON
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `conversation_${conversationId}_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        // Initialize the chat history viewer
        const chatViewer = new ChatHistoryViewer();
    </script>
</body>
</html>
