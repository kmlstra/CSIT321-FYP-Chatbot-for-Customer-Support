<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleverCompanion - Singapore Automotive Assistant</title>
    <meta name="description" content="CleverCompanion is Singapore's premier automotive chatbot assistant. Get instant help with COE prices, vehicle recommendations, test drives, and more.">
    <meta name="keywords" content="Singapore automotive, COE prices, car buying, vehicle assistant, chatbot">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50">
    
    <!-- Support Configuration now handled by backend information.py -->
    
    <!-- CleverCompanion Widget with automatic backend URL detection -->
    <!-- Remove hardcoded URL to allow dynamic detection for any environment -->
    <script src="clevercompanion-widget.js"></script>
    
    <script>
        // Page functionality
        function startChat() {
            if (window.CleverCompanionWidget) {
                window.CleverCompanionWidget.open();
            }
        }
        
        function quickAction(action) {
            if (window.CleverCompanionWidget) {
                window.CleverCompanionWidget.open();
                setTimeout(() => {
                    window.CleverCompanionWidget.sendMessage(action);
                }, 500);
            }
        }
        
        function scrollToDemo() {
            document.getElementById('demo-section').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }
        
        // Add smooth scrolling and animations
        document.addEventListener('DOMContentLoaded', function() {
            // Animate elements on scroll
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, observerOptions);
            
            // Observe all cards
            document.querySelectorAll('.card-hover').forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.6s ease';
                observer.observe(card);
            });
        });
    </script>
</body>
</html>
