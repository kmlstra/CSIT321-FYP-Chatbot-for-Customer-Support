version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: automotive-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - automotive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    image: csit321fyp/automotive-chatbot-frontend:latest
    container_name: automotive-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_DOMAIN=http://13.215.240.173
      - NEXT_PUBLIC_API_URL=http://13.215.240.173:8000
      - NEXT_PUBLIC_RASA_URL=http://13.215.240.173:5005
      - NEXT_PUBLIC_WIDGET_URL=http://13.215.240.173
      - NEXT_PUBLIC_FRONTEND_URL=http://13.215.240.173
      - NEXT_PUBLIC_BACKEND_URL=http://13.215.240.173:8000
      - NEXT_PUBLIC_FRONTEND_PORT=80
      - NEXT_PUBLIC_BACKEND_PORT=8000
      - NEXT_PUBLIC_RASA_PORT=5005
      - NEXT_PUBLIC_DEBUG=false
      - NEXT_PUBLIC_ENV=production
    volumes:
      - frontend_static:/app/.next/static
    networks:
      - automotive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Service
  backend:
    image: csit321fyp/automotive-chatbot-backend:latest
    container_name: automotive-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=${MONGODB_URI}
      - RASA_SERVER_URL=http://rasa:5005
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - automotive-network
    depends_on:
      - redis
      - rasa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RASA NLU/Core Service
  rasa:
    image: automotive-chatbot-rasa:latest
    container_name: automotive-rasa
    ports:
      - "5005:5005"
    environment:
      - RASA_MODEL_PATH=/app/models
      - RASA_ENDPOINTS_PATH=/app/endpoints-aws.yml
      - ENVIRONMENT=aws
    volumes:
      - rasa_models:/app/models
      - rasa_logs:/app/logs
      - ./endpoints-aws.yml:/app/endpoints-aws.yml:ro
    networks:
      - automotive-network
    restart: unless-stopped
    command: ["bash", "/app/start-rasa.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5005/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: automotive-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - automotive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: automotive-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - automotive-network
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: automotive-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - automotive-network
    restart: unless-stopped

volumes:
  nginx_logs:
  frontend_static:
  backend_logs:
  backend_uploads:
  rasa_models:
  rasa_logs:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  automotive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16