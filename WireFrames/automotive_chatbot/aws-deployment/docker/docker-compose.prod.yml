version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: automotive-nginx-prod
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "5005:5005"
      - "5055:5055"
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - rasa
      - rasa-actions
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Service
  frontend:
    build:
      context: ../../
      dockerfile: aws-deployment/docker/Dockerfile.frontend
    environment:
      - NODE_ENV=production
      # Use unified domain:port approach
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-http://localhost}
      - NEXT_PUBLIC_BACKEND_PORT=${BACKEND_PORT:-8000}
      - NEXT_PUBLIC_FRONTEND_PORT=${FRONTEND_PORT:-80}
      - NEXT_PUBLIC_RASA_PORT=${RASA_PORT:-5005}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - frontend_static:/app/.next/static
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend Service
  backend:
    build:
      context: ../../
      dockerfile: aws-deployment/docker/Dockerfile.backend
    environment:
      - ENVIRONMENT=production
      - MONGODB_URI=${MONGODB_URI}
      # Use unified domain:port approach
      - DOMAIN=${DOMAIN:-http://localhost}
      - RASA_PORT=${RASA_PORT:-5005}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - FRONTEND_PORT=${FRONTEND_PORT:-80}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - automotive-network
    depends_on:
      - redis
      - rasa
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # RASA Service
  rasa:
    build:
      context: ../../
      dockerfile: aws-deployment/docker/Dockerfile.rasa
    environment:
      - RASA_MODEL_PATH=/app/models
      - RASA_ENDPOINTS_PATH=/app/endpoints.yml
      - RASA_CORS_ORIGINS=*
    volumes:
      - rasa_models:/app/models
      - rasa_logs:/app/logs
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 1.5G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5005/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # RASA Actions Service
  rasa-actions:
    build:
      context: ../../
      dockerfile: aws-deployment/docker/Dockerfile.rasa-actions
    environment:
      - RASA_SDK_ENDPOINT_URL=http://rasa-actions:5055/webhook
      - MONGODB_URI=${MONGODB_URI}
      - ENVIRONMENT=production
    volumes:
      - rasa_logs:/app/logs
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: automotive-redis-prod
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Log Aggregator
  fluentd:
    image: fluent/fluentd:v1.16-debian-1
    container_name: automotive-fluentd
    volumes:
      - ./fluentd.conf:/fluentd/etc/fluent.conf:ro
      - backend_logs:/var/log/backend:ro
      - nginx_logs:/var/log/nginx:ro
      - rasa_logs:/var/log/rasa:ro
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Monitoring - Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: automotive-node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # Monitoring - cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: automotive-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - automotive-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

volumes:
  nginx_logs:
    driver: local
  frontend_static:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  rasa_models:
    driver: local
  rasa_logs:
    driver: local
  redis_data:
    driver: local

networks:
  automotive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: automotive-br0