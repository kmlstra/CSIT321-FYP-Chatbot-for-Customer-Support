# Docker Compose Configuration for Production Deployment on AWS EC2
# This file is optimized for production use with MongoDB Atlas

version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ../
      dockerfile: aws-deployment/docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_ENV=production
        - NEXT_PUBLIC_DOMAIN=${NEXT_PUBLIC_DOMAIN:-http://localhost}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        - NEXT_PUBLIC_RASA_URL=${NEXT_PUBLIC_RASA_URL:-http://localhost:5005}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        - NEXT_PUBLIC_FRONTEND_PORT=3000
        - NEXT_PUBLIC_BACKEND_PORT=8000
        - NEXT_PUBLIC_RASA_PORT=5005
        - NEXT_PUBLIC_DEBUG=${DEBUG:-false}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-1800}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-1000}
    depends_on:
      - backend
      - rasa-core
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: awslogs
      options:
        awslogs-group: "/aws/ec2/automotive-chatbot"
        awslogs-region: "ap-southeast-1"
        awslogs-stream: "frontend"
    volumes:
      - frontend-cache:/app/cache
      - frontend-logs:/app/logs

  # Backend API Service
  backend:
    build:
      context: ../
      dockerfile: aws-deployment/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # MongoDB Atlas Configuration
      - MONGODB_TYPE=atlas
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-automotive_chatbot}
      - MONGODB_COLLECTION_APPOINTMENTS=${MONGODB_COLLECTION_APPOINTMENTS:-appointments}
      - MONGODB_COLLECTION_CUSTOMERS=${MONGODB_COLLECTION_CUSTOMERS:-customers}
      - MONGODB_COLLECTION_SERVICES=${MONGODB_COLLECTION_SERVICES:-services}
      - MONGODB_COLLECTION_CHAT_HISTORY=${MONGODB_COLLECTION_CHAT_HISTORY:-chat_history}
      # Database Pool Settings
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-5}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-50}
      - DB_POOL_MAX_IDLE_TIME=${DB_POOL_MAX_IDLE_TIME:-30000}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT:-10000}
      - DB_SERVER_SELECTION_TIMEOUT=${DB_SERVER_SELECTION_TIMEOUT:-5000}
      - DB_RETRY_WRITES=${DB_RETRY_WRITES:-true}
      - DB_W=${DB_W:-majority}
      # Cache Configuration
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-1800}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-1000}
      - CACHE_CLEANUP_INTERVAL=${CACHE_CLEANUP_INTERVAL:-300}
      # Security Settings
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,https://yourdomain.com}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,yourdomain.com}
      # Email Configuration
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM}
      # Feature Flags
      - FEATURE_APPOINTMENTS=${FEATURE_APPOINTMENTS:-true}
      - FEATURE_EMAIL_NOTIFICATIONS=${FEATURE_EMAIL_NOTIFICATIONS:-true}
      - FEATURE_CHAT_HISTORY=${FEATURE_CHAT_HISTORY:-true}
      - FEATURE_ANALYTICS=${FEATURE_ANALYTICS:-true}
      # Performance Settings
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - UVICORN_MAX_REQUESTS=${UVICORN_MAX_REQUESTS:-1000}
      - UVICORN_MAX_REQUESTS_JITTER=${UVICORN_MAX_REQUESTS_JITTER:-100}
      - UVICORN_TIMEOUT_KEEP_ALIVE=${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
      # Monitoring
      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
      - backend_cache:/app/cache
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: awslogs
      options:
        awslogs-group: "/aws/ec2/automotive-chatbot"
        awslogs-region: "ap-southeast-1"
        awslogs-stream: "backend"

  # RASA Core Service
  rasa-core:
    build:
      context: ../
      dockerfile: aws-deployment/docker/Dockerfile.rasa
    ports:
      - "5005:5005"
    environment:
      # RASA Core Configuration
      - RASA_MODEL_SERVER=http://localhost:5005
      - RASA_ACTION_ENDPOINT=http://rasa-actions:5055/webhook
      - RASA_CORS_ORIGINS=*
      - RASA_ENABLE_API=true
      - RASA_RESPONSE_TIMEOUT=3600
      - RASA_LOG_LEVEL=${RASA_LOG_LEVEL:-INFO}
      # MongoDB Atlas Configuration for Actions
      - MONGODB_TYPE=atlas
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-automotive_chatbot}
      - MONGODB_COLLECTION_APPOINTMENTS=${MONGODB_COLLECTION_APPOINTMENTS:-appointments}
      - MONGODB_COLLECTION_CUSTOMERS=${MONGODB_COLLECTION_CUSTOMERS:-customers}
      - MONGODB_COLLECTION_SERVICES=${MONGODB_COLLECTION_SERVICES:-services}
      - MONGODB_COLLECTION_CHAT_HISTORY=${MONGODB_COLLECTION_CHAT_HISTORY:-chat_history}
      # Database Pool Settings
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-5}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-20}
      - DB_POOL_MAX_IDLE_TIME=${DB_POOL_MAX_IDLE_TIME:-30000}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT:-10000}
      - DB_SERVER_SELECTION_TIMEOUT=${DB_SERVER_SELECTION_TIMEOUT:-5000}
      - DB_RETRY_WRITES=${DB_RETRY_WRITES:-true}
      - DB_W=${DB_W:-majority}
      # Cache Configuration
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-1800}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-500}
      - CACHE_CLEANUP_INTERVAL=${CACHE_CLEANUP_INTERVAL:-300}
      # Email Configuration
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM}
      # Feature Flags
      - FEATURE_APPOINTMENTS=${FEATURE_APPOINTMENTS:-true}
      - FEATURE_EMAIL_NOTIFICATIONS=${FEATURE_EMAIL_NOTIFICATIONS:-true}
      - FEATURE_CHAT_HISTORY=${FEATURE_CHAT_HISTORY:-true}
      - FEATURE_ANALYTICS=${FEATURE_ANALYTICS:-true}
      # Performance Settings
      - RASA_WORKERS=${RASA_WORKERS:-2}
      - RASA_MAX_REQUESTS=${RASA_MAX_REQUESTS:-1000}
      - RASA_BACKLOG=${RASA_BACKLOG:-100}
      # Security Settings
      - RASA_JWT_SECRET=${RASA_JWT_SECRET}
      - RASA_JWT_METHOD=${RASA_JWT_METHOD:-HS256}
      # Monitoring
      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
    depends_on:
      - rasa-actions
    volumes:
      - rasa_models:/app/models
      - rasa_core_logs:/app/logs
      - rasa_cache:/app/cache
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1.5G
          cpus: '1.0'
    logging:
      driver: awslogs
      options:
        awslogs-group: "/aws/ec2/automotive-chatbot"
        awslogs-region: "ap-southeast-1"
        awslogs-stream: "rasa-core"

  # RASA Actions Service
  rasa-actions:
    build:
      context: ../
      dockerfile: aws-deployment/docker/Dockerfile.rasa-actions
    ports:
      - "5055:5055"
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # MongoDB Atlas Configuration
      - MONGODB_TYPE=atlas
      - MONGODB_ATLAS_URI=${MONGODB_ATLAS_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-automotive_chatbot}
      - MONGODB_COLLECTION_APPOINTMENTS=${MONGODB_COLLECTION_APPOINTMENTS:-appointments}
      - MONGODB_COLLECTION_CUSTOMERS=${MONGODB_COLLECTION_CUSTOMERS:-customers}
      - MONGODB_COLLECTION_SERVICES=${MONGODB_COLLECTION_SERVICES:-services}
      - MONGODB_COLLECTION_CHAT_HISTORY=${MONGODB_COLLECTION_CHAT_HISTORY:-chat_history}
      # Database Pool Settings
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-3}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-15}
      - DB_POOL_MAX_IDLE_TIME=${DB_POOL_MAX_IDLE_TIME:-30000}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT:-10000}
      - DB_SERVER_SELECTION_TIMEOUT=${DB_SERVER_SELECTION_TIMEOUT:-5000}
      - DB_RETRY_WRITES=${DB_RETRY_WRITES:-true}
      - DB_W=${DB_W:-majority}
      # Cache Configuration
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL=${CACHE_TTL:-1800}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-500}
      - CACHE_CLEANUP_INTERVAL=${CACHE_CLEANUP_INTERVAL:-300}
      # Email Configuration
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM}
      # Feature Flags
      - FEATURE_APPOINTMENTS=${FEATURE_APPOINTMENTS:-true}
      - FEATURE_EMAIL_NOTIFICATIONS=${FEATURE_EMAIL_NOTIFICATIONS:-true}
      - FEATURE_CHAT_HISTORY=${FEATURE_CHAT_HISTORY:-true}
      - FEATURE_ANALYTICS=${FEATURE_ANALYTICS:-true}
      # Performance Settings
      - RASA_ACTION_WORKERS=${RASA_ACTION_WORKERS:-2}
      - RASA_ACTION_MAX_REQUESTS=${RASA_ACTION_MAX_REQUESTS:-500}
      - RASA_ACTION_TIMEOUT=${RASA_ACTION_TIMEOUT:-60}
      # Security Settings
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Monitoring
      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
    volumes:
      - rasa-actions-logs:/app/logs
      - rasa-actions-cache:/app/cache
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 768M
          cpus: '0.75'
    logging:
      driver: awslogs
      options:
        awslogs-group: "/aws/ec2/automotive-chatbot"
        awslogs-region: "ap-southeast-1"
        awslogs-stream: "rasa-actions"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: automotive-chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/docker/automotive-chatbot
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        awslogs-stream-prefix: nginx
    depends_on:
      - frontend
      - backend
      - rasa-core

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: automotive-chatbot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/docker/automotive-chatbot
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        awslogs-stream-prefix: prometheus

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: automotive-chatbot-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/docker/automotive-chatbot
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        awslogs-stream-prefix: grafana
    depends_on:
      - prometheus

  # Log Aggregator (Fluentd)
  fluentd:
    image: fluent/fluentd:v1.14-debian-1
    container_name: automotive-chatbot-fluentd
    volumes:
      - ./logging/fluentd.conf:/fluentd/etc/fluent.conf:ro
      - frontend_logs:/var/log/frontend:ro
      - backend_logs:/var/log/backend:ro
      - rasa_core_logs:/var/log/rasa-core:ro
      - rasa-actions-logs:/var/log/rasa-actions:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - automotive-chatbot-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
        reservations:
          memory: 128m
          cpus: '0.1'
    logging:
      driver: awslogs
      options:
        awslogs-group: /aws/docker/automotive-chatbot
        awslogs-region: ${AWS_REGION:-ap-southeast-1}
        awslogs-stream-prefix: fluentd

# Named Volumes
volumes:
  # Application Data
  rasa_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/data/models
  
  # Logs
  frontend_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/logs/frontend
  
  backend_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/logs/backend
  
  rasa_core_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/logs/rasa-core
  
  rasa-actions-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/logs/rasa-actions
  
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/logs/nginx
  
  # Monitoring Data
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/data/prometheus
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/data/grafana
  
  # Application Uploads
  backend_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/data/uploads
  
  # Cache Volumes
  frontend-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/cache/frontend
  
  backend-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/cache/backend
  
  rasa-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/cache/rasa-core
  
  rasa-actions-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/automotive-chatbot/cache/rasa-actions

# Networks
networks:
  automotive-chatbot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: automotive-chatbot-br
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500