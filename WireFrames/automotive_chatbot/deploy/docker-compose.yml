services:
  # Backend Services (FastAPI + RASA)
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: automotive-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Singapore
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB=${MONGODB_DB:-automotive_chatbot_saas}
      - CHATBOT_MONGODB_URL=${MONGODB_URL}
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - RASA_URL=http://localhost:5005
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NODE_ENV=production
    ports:
      - "${BACKEND_PORT:-8001}:8001"
      - "${RASA_PORT:-5005}:5005"
      - "${RASA_ACTIONS_PORT:-5055}:5055"
    volumes:
      - backend_data:/app/cache
      - backend_logs:/app/logs
      - backend_models:/app/models
    networks:
      - automotive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 2G
        reservations:
          cpus: '0.4'
          memory: 1G

  # Frontend Service (Next.js with Nginx)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: automotive-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - NEXT_PUBLIC_RASA_URL=${NEXT_PUBLIC_RASA_URL:-http://localhost:5005}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - automotive-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  # Nginx Reverse Proxy (Optional - for production load balancing)
  nginx:
    image: nginx:alpine
    container_name: automotive-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - automotive-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - production

  # Redis Cache (Optional - for session management and caching)
  redis:
    image: redis:7-alpine
    container_name: automotive-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-defaultpassword123}
    volumes:
      - redis_data:/data
    networks:
      - automotive-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    profiles:
      - production

volumes:
  backend_data:
    driver: local
  backend_logs:
    driver: local
  backend_models:
    driver: local
  nginx_logs:
    driver: local
  redis_data:
    driver: local

networks:
  automotive-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: automotive-br0