version: "3.1"

entities:
  - appointment_date
  - appointment_time
  - service_type
  - customer_name
  - customer_phone
  - customer_email
  - appointment_id


slots:
  appointment_date:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: appointment_date
  appointment_time:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: appointment_time
  service_type:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: service_type
  customer_name:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: customer_name
  customer_phone:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: customer_phone
  customer_email:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: customer_email
  appointment_id:
    type: text
    influence_conversation: true
    mappings:
    - type: from_entity
      entity: appointment_id
  appointment_active:
    type: bool
    initial_value: false
    influence_conversation: true
    mappings:
    - type: custom


intents:
  - greet
  - goodbye
  - affirm
  - deny
  - out_of_scope
  - ask_coe_prices
  - ask_coe_category
