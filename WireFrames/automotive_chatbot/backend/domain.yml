  - ask_coe_renewal_assistance
  - ask_coe_bidding_assistance
  - ask_clarification
  - ask_help
  - ask_capability_confirm
  - ask_live_support
  # Contact-related intents
  - ask_contact
  - ask_email_only
  - ask_phone_only
  - ask_whatsapp_only
  - ask_store_location
  - ask_operating_hours
  - ask_business_hours
  - ask_public_holiday_hours
  - confirm_schedule_visit
  # Appointment booking intents
  - book_appointment
  - ask_appointment_availability
  - view_appointments
  - cancel_appointment
