responses:
  utter_greet:
  - text: "👋 Hi there! I'm CleverCompanion, your intelligent automotive assistant for Singapore. I can help you with vehicle information, COE prices, loan calculations, maintenance advice, and more. How can I assist you today?"

  utter_goodbye:
  - text: "Thank you for using CleverCompanion! Have a great day and safe driving! 🚗"

  utter_default:
  - text: "I'm sorry, I didn't understand that. I'm your automotive assistant and can help with vehicle information, COE matters, financing, maintenance, and car-related queries. What would you like to know?"

  utter_out_of_scope:
  - text: "I focus on automotive-related topics including vehicles, COE information, financing, maintenance, and car buying advice. How can I help you with your automotive needs?"

  utter_features:
  - text: "I can assist you with vehicle information, COE prices and categories, loan calculations, maintenance schedules, test drive bookings, and general automotive guidance. What interests you most?"

  utter_appointment_cancelled:
  - text: "✅ **No worries at all!** Your appointment request has been cancelled successfully. 😊\n\n🚗 **Ready to book again?** I'm here whenever you need to schedule a service!\n\n💬 **How else can I assist you today?** Whether it's vehicle information, COE details, or any other automotive questions - I'm here to help!"
  - text: "🎯 **All sorted!** Your appointment has been cancelled as requested.\n\n⭐ **Planning ahead?** Feel free to reach out when you're ready to book again - I'll be happy to help you find the perfect time slot!\n\n🤝 **What can I help you with next?** I'm here for all your automotive needs!"
  - text: "✨ **Done!** Your appointment cancellation is complete.\n\n🔄 **Change of plans happens!** When you're ready to reschedule or book a new service, just let me know and I'll take care of everything.\n\n💡 **Anything else on your mind?** I'm here to help with vehicles, financing, COE information, and more!"

