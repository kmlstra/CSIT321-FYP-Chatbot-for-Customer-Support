version: "3.1"

rules:

- rule: Handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Handle NLU fallback
  condition:
  - active_loop: null
  steps:
  - intent: nlu_fallback
  - action: action_default_fallback

- rule: Handle low confidence predictions
  steps:
  - intent: nlu_fallback
  - action: action_default_fallback