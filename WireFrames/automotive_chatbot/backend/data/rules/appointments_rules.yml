version: "3.1"

rules:

# Core appointment booking rule - handles all booking scenarios
- rule: Book appointment when user asks
  condition:
  - active_loop: null
  steps:
  - intent: book_appointment
  - action: action_book_appointment

# Handle appointment availability checks - removed to prevent repeated triggers
# This intent should be handled within the booking flow, not as a separate trigger
# - rule: Check appointment availability
#   condition:
#   - active_loop: null
#   steps:
#   - intent: ask_appointment_availability
#   - action: action_book_appointment

# View existing appointments
- rule: View appointments when requested
  condition:
  - active_loop: null
  steps:
  - intent: view_appointments
  - action: action_view_appointments

# Cancel appointments
- rule: Cancel appointment when requested
  condition:
  - active_loop: null
  steps:
  - intent: cancel_appointment
  - action: action_cancel_appointment

# Handle customer details during active appointment booking
- rule: Process appointment details during booking
  steps:
  - intent: provide_appointment_details
  - action: action_book_appointment

# Removed problematic rule that was causing appointment flow to restart
# when users provided date/time information

# Removed problematic confirm appointment rule that was causing repeated triggers
# The confirmation should be handled within the booking flow, not as a separate trigger
# - rule: Confirm appointment booking
#   condition:
#   - active_loop: null
#   steps:
#   - intent: confirm_appointment
#   - action: action_book_appointment