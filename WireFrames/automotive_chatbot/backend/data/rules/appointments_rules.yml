version: "3.1"

rules:

- rule: Book appointment when user asks
  condition:
  - active_loop: null
  steps:
  - intent: book_appointment
  - action: action_book_appointment

- rule: Check appointment availability
  condition:
  - active_loop: null
  steps:
  - intent: ask_appointment_availability
  - action: action_book_appointment

- rule: View appointments when requested
  condition:
  - active_loop: null
  steps:
  - intent: view_appointments
  - action: action_view_appointments

- rule: Cancel appointment when requested
  condition:
  - active_loop: null
  steps:
  - intent: cancel_appointment
  - action: action_cancel_appointment

- rule: Handle appointment status inquiry
  condition:
  - active_loop: null
  steps:
  - intent: ask_appointment_status
  - action: action_view_appointments

- rule: Process appointment details when provided
  condition:
  - active_loop: null
  - slot_was_set:
    - appointment_active: true
  steps:
  - intent: provide_appointment_details
  - action: action_book_appointment

- rule: Confirm appointment booking
  condition:
  - active_loop: null
  steps:
  - intent: confirm_appointment
  - action: action_book_appointment

- rule: Handle reschedule request
  condition:
  - active_loop: null
  steps:
  - intent: reschedule_appointment
  - action: action_view_appointments

- rule: Respond to appointment confirmation during booking
  condition:
  - active_loop: null
  - slot_was_set:
    - appointment_active: true
    - appointment_date: true
    - service_type: true
    - customer_name: true
    - customer_phone: false
  steps:
  - intent: affirm
  - action: action_book_appointment
  wait_for_user_input: false

- rule: Handle appointment denial during booking
  condition:
  - active_loop: null
  - slot_was_set:
    - appointment_active: true
    - appointment_date: true
    - service_type: true
    - customer_name: true
    - customer_phone: false
  steps:
  - intent: deny
  - action: utter_appointment_cancelled
  - action: action_listen
  wait_for_user_input: false