    entities:
    - customer_phone: "91234567"
  - action: appointment_form
  - slot_was_set:
    - requested_slot: appointment_date
  - intent: inform
    entities:
    - appointment_date: "tomorrow"
  - action: appointment_form
  - slot_was_set:
    - requested_slot: appointment_time
  - intent: inform
    entities:
    - appointment_time: "2pm"
  - action: appointment_form
  - active_loop: null
