version: "3.1"

stories:

- story: simple appointment booking
  steps:
  - intent: book_appointment
  - action: action_book_appointment

- story: appointment booking with service type
  steps:
  - intent: book_appointment
    entities:
    - service_type: "test drive"
  - action: action_book_appointment

- story: appointment form completion flow
  steps:
  - active_loop: appointment_form
