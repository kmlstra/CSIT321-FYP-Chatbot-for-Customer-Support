recipe: default.v1
language: en

pipeline:
  # Tokenizer
- name: WhitespaceTokenizer

  # Featurizers (only necessary ones)
- name: CountVectorsFeaturizer
  analyzer: word
  min_ngram: 1
  max_ngram: 2    # smaller n-grams for speed

  # DIET classifier for intents & entities
- name: DIETClassifier
  epochs: 30
  constrain_similarities: true

  # Fallback classifier for low confidence predictions
- name: FallbackClassifier
  threshold: 0.7
  ambiguity_threshold: 0.1

  # Optional: map entity synonyms
- name: EntitySynonymMapper

  # ResponseSelector for FAQs
- name: ResponseSelector
  epochs: 30
  ranking_length: 5    # fewer candidates for speed

policies:
  # Memorize exact stories
- name: MemoizationPolicy

  # Rules for simple conversations
- name: RulePolicy

  # Context-aware policy
- name: TEDPolicy
  max_history: 3    # shorter history for faster inference
  epochs: 40
  batch_size: 16
  learning_rate: 0.001
  ranking_length: 5
  constrain_similarities: true
  model_confidence: softmax
  loss_type: "cross_entropy"
  evaluate_every_number_of_epochs: 5
  evaluate_on_number_of_examples: 50
  epochs_patience: 10

# Tracker store
tracker_store:
  type: InMemoryTrackerStore  # super fast for live sessions
assistant_id: 20250816-001938-equidistant-encumbrance
